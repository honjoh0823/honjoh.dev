<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESIGN 02 // RANGER</title>
    <style>
        :root {
            --bg: #0F0F0F;
            /* Slightly lighter, warm dark */
            --fg: #E0E0E0;
            --dim: #444444;
            --col-border: #333;
            --active-bg: #E0E0E0;
            --active-fg: #0F0F0F;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 13px;
            /* Smaller, denser */
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Ranger-style Columns */
        .columns {
            display: flex;
            flex-grow: 1;
            border-bottom: 1px solid var(--col-border);
        }

        .col {
            border-right: 1px solid var(--col-border);
            padding: 1rem 0;
            overflow-y: auto;
        }

        .col-left {
            width: 20%;
            min-width: 150px;
        }

        .col-mid {
            width: 30%;
            min-width: 200px;
        }

        .col-right {
            flex-grow: 1;
            padding: 2rem;
        }

        /* List Items */
        .item {
            padding: 2px 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .item.active {
            background-color: var(--active-bg);
            color: var(--active-fg);
        }

        .item.parent-active {
            text-decoration: underline;
            color: #fff;
        }

        /* Content Preview */
        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.2rem;
            font-weight: normal;
            border-bottom: 2px solid var(--fg);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        p {
            max-width: 60ch;
            line-height: 1.6;
        }

        /* Status Bar */
        .status-bar {
            background-color: var(--active-bg);
            color: var(--active-fg);
            padding: 4px 1rem;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="columns">
        <!-- Parent Directory (Context) -->
        <div class="col col-left">
            <div class="item parent-active"><span class="dim">../</span></div>
            <div class="item parent-active">home/</div>
            <div class="item"><span class="dim">etc/</span></div>
            <div class="item"><span class="dim">var/</span></div>
            <div class="item"><span class="dim">usr/</span></div>
        </div>

        <!-- Current Directory (Navigation) -->
        <div class="col col-mid" id="mid-col">
            <div class="item active" data-target="works">works/</div>
            <div class="item" data-target="article">article/</div>
            <div class="item" data-target="about">about.md</div>
            <div class="item" data-target="contact">contact.sh</div>
            <div class="item" data-target="config">.config</div>
        </div>

        <!-- Preview (Content) -->
        <div class="col col-right" id="preview-col">
            <h1 id="p-title">works/</h1>
            <p id="p-desc">
                Archive of digital fabrications and web experiments.
            </p>
            <br>
            <div style="border: 1px dashed #444; padding: 1rem; display: inline-block;">
                <span class="dim">drwxr-xr-x user staff 2026-02-15</span><br>
                <span class="dim">0 items</span>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span>VISUAL SELECTION</span>
        <span>MODEL: Gemini 2.0 Pro (Antigravity)</span>
        <span>100%</span>
    </div>

    <script>
        const data = {
            works: { type: 'DIR', content: "Archive of digital fabrications and web experiments." },
            article: { type: 'DIR', content: "Written thoughts on design and code." },
            about: { type: 'FILE', content: "Identity profile. Located in Tokyo." },
            contact: { type: 'EXEC', content: "Initiate communication protocol." },
            config: { type: 'CONF', content: "System preferences." }
        };

        const midItems = document.querySelectorAll('#mid-col .item');
        let midIdx = 0;

        function render(idx) {
            midItems.forEach(i => i.classList.remove('active'));
            midItems[idx].classList.add('active');

            const key = midItems[idx].dataset.target;
            const info = data[key];

            document.getElementById('p-title').innerText = key + (info.type === 'DIR' ? '/' : '');
            document.getElementById('p-desc').innerText = info.content;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'j' || e.key === 'ArrowDown') {
                midIdx = (midIdx + 1) % midItems.length;
                render(midIdx);
            }
            if (e.key === 'k' || e.key === 'ArrowUp') {
                midIdx = (midIdx - 1 + midItems.length) % midItems.length;
                render(midIdx);
            }
        });
    </script>
</body>

</html>
