<style data-vite-dev-id="D:/honjoh.dev/src/layouts/TerminalLayout.astro?astro&#38;type=style&#38;index=0&#38;lang.css">/* === Reset Layout.astro body globals inside .terminal === */
    body:has(.terminal) {
        background: #0e0e0e;
        color: #c0c0c0;
        font-family: "JetBrains Mono", "Consolas", "Monaco", monospace;
        line-height: 1.6;
        margin: 0;
        padding: 0;
    }

    /* === Terminal Shell === */
    .terminal {
        position: relative;
        height: 100vh;
        background: #0e0e0e;
        color: #c0c0c0;
        font-family: "JetBrains Mono", "Consolas", "Monaco", monospace;
        font-size: 14px;
        line-height: 1.6;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 3rem 4rem;
    }

    /* Breathing ambient glow */
    .terminal::before {
        content: "";
        position: fixed;
        top: 40%;
        left: 30%;
        width: 600px;
        height: 600px;
        background: radial-gradient(
            circle,
            rgba(160, 160, 160, 0.02) 0%,
            transparent 70%
        );
        animation: terminalBreathe 8s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
    }

    @keyframes terminalBreathe {
        0%,
        100% {
            opacity: 0.4;
            transform: scale(0.95);
        }
        50% {
            opacity: 1;
            transform: scale(1.05);
        }
    }

    /* Reset heading styles from Layout.astro */
    .terminal h1,
    .terminal h2,
    .terminal h3 {
        font-family: inherit;
        line-height: inherit;
    }

    /* Reset link styles from Layout.astro */
    .terminal a {
        color: inherit;
        text-decoration: none;
        border-bottom: none;
        transition: none;
    }

    .terminal a:hover {
        border-bottom: none;
        border-bottom-color: transparent;
    }

    /* Terminal body — content area */
    .terminal-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: 60ch;
        position: relative;
        z-index: 1;
    }

    /* Scrollable variant (for article pages) */
    .terminal-body.scrollable {
        overflow-y: auto;
    }

    .terminal-body.scrollable::-webkit-scrollbar {
        width: 4px;
    }

    .terminal-body.scrollable::-webkit-scrollbar-track {
        background: transparent;
    }

    .terminal-body.scrollable::-webkit-scrollbar-thumb {
        background: #2a2a2a;
        border-radius: 2px;
    }

    /* Page title */
    .page-title {
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 700;
        color: #e0e0e0;
        margin-bottom: 2rem;
        font-family: inherit;
        letter-spacing: 0.1em;
    }

    /* === Navigation list === */
    .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 100%;
        list-style: none;
    }

    .nav-item {
        display: flex;
        align-items: center;
        padding: 0.65rem 1rem;
        border-left: 2px solid transparent;
        text-decoration: none;
        color: #c0c0c0;
        transition: all 0.15s ease;
        cursor: pointer;
    }

    .nav-item:hover,
    .nav-item.nav-active {
        background: rgba(160, 160, 160, 0.06);
        border-left-color: #a0a0a0;
        color: #e0e0e0;
    }

    .nav-key {
        width: 2.5ch;
        color: #606060;
        font-weight: 600;
        font-size: 0.85rem;
        margin-right: 1.5ch;
        flex-shrink: 0;
    }

    .nav-item.nav-active .nav-key {
        color: #a0a0a0;
    }

    .nav-label {
        color: #c0c0c0;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: lowercase;
        transition: color 0.15s;
    }

    .nav-item.nav-active .nav-label {
        color: #e0e0e0;
    }

    .nav-desc {
        margin-left: auto;
        color: #606060;
        font-size: 0.8rem;
        font-weight: 300;
    }

    .nav-date {
        color: #606060;
        font-size: 14px;
        flex-shrink: 0;
    }

    /* Disabled nav items */
    .nav-item.nav-disabled {
        opacity: 0.35;
        cursor: default;
    }
    .nav-item.nav-disabled:hover,
    .nav-item.nav-disabled.nav-active {
        background: rgba(160, 160, 160, 0.03);
        border-left-color: transparent;
    }

    /* === kbd === */
    kbd {
        display: inline-block;
        padding: 0 4px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 2px;
        color: #808080;
        font-family: inherit;
        font-size: inherit;
        line-height: 1.4;
        margin: 0 0.3ch;
    }

    /* === Fade-in animation === */
    .terminal-body > * {
        opacity: 0;
        transform: translateY(4px);
        animation: terminalFadeIn 0.3s ease forwards;
    }
    .terminal-body > :nth-child(1) {
        animation-delay: 0.05s;
    }
    .terminal-body > :nth-child(2) {
        animation-delay: 0.1s;
    }
    .terminal-body > :nth-child(3) {
        animation-delay: 0.2s;
    }

    @keyframes terminalFadeIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* === Responsive === */
    @media (max-width: 640px) {
        .terminal {
            padding: 1.5rem 1.5rem;
        }
        .nav-desc,
        .nav-date {
            display: none;
        }
    }</style>
