<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HONJOH.DEV // CLI CONCEPT</title>
    <style>
        :root {
            /* System Colors - Sophisticated Dark */
            --bg: #0a0a0a;
            --fg: #e5e5e5;
            --dim: #666666;
            --accent: #ffffff; /* Pure white for focus */
            --selection-bg: #e5e5e5;
            --selection-fg: #0a0a0a;
            
            /* Typography */
            --font-mono: 'JetBrains Mono', 'Menlo', 'Courier New', monospace;
            --cell-height: 1.5rem;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: var(--cell-height);
            margin: 0;
            padding: 2rem;
            overflow: hidden; /* Anti-Scroll Manifesto */
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Utility: Information Reduction */
        .dim { color: var(--dim); }
        .hidden { display: none; }
        
        /* Layout: Paged View */
        .container {
            max-width: 80ch; /* Readable line length */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Component: Header (Minimal) */
        header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
        }

        /* Component: Interactive List */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            margin-bottom: 2rem;
        }

        li {
            display: flex;
            align-items: baseline;
            padding: 0 0.5rem;
            margin-bottom: 0px; /* Dense */
            cursor: pointer;
        }

        .key {
            width: 3ch;
            color: var(--dim);
            margin-right: 1ch;
        }

        .label {
            flex-grow: 1;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .meta {
            color: var(--dim);
            font-size: 0.9em;
        }

        /* State: Active / Focused (Reverse Video) */
        li.active {
            background-color: var(--selection-bg);
            color: var(--selection-fg);
        }
        
        li.active .key, li.active .meta {
            color: var(--selection-fg);
        }

        /* Component: Command Line */
        .prompt-line {
            margin-top: auto;
            display: flex;
            gap: 1ch;
            padding-top: 1rem;
            border-top: 1px solid #333; /* Very subtle separation */
        }
        .caret {
            background-color: var(--fg);
            width: 1ch;
            height: 1.2em;
            display: inline-block;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .description-pane {
            color: var(--dim);
            padding-left: 4.5ch;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER: Context only -->
        <header>
            <span>honjoh.dev</span>
            <span class="dim">STYLISH_CLI // NO_DECORATION</span>
        </header>

        <!-- CONTENT -->
        <div class="content">
            <div class="dim" style="margin-bottom: 1rem;">LOCATION: ~/home/</div>
            
            <!-- NAV -->
            <ul id="menu">
                <li class="active" data-desc="Creative works and projects archive.">
                    <span class="key">1</span>
                    <span class="label">works</span>
                    <span class="meta">[DIR]</span>
                </li>
                <li data-desc="Articles, thoughts, and technical logs.">
                    <span class="key">2</span>
                    <span class="label">articles</span>
                    <span class="meta">[DIR]</span>
                </li>
                <li data-desc="Contact information and AI interface.">
                    <span class="key">3</span>
                    <span class="label">contact</span>
                    <span class="meta">[CLI]</span>
                </li>
                <li data-desc="System configuration and preferences.">
                    <span class="key">4</span>
                    <span class="label">setting</span>
                    <span class="meta">[CFG]</span>
                </li>
            </ul>

            <!-- DYNAMIC DESCRIPTION -->
            <div id="desc" class="description-pane">
                > Creative works and projects archive.
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="prompt-line">
        <span class="dim">user@honjoh:~$</span>
        <span id="cmd-input">cd works</span><span class="caret"></span>
    </div>

    <!-- Minimal JS for prototype feel -->
    <script>
        const items = document.querySelectorAll('#menu li');
        const descEl = document.getElementById('desc');
        const cmdEl = document.getElementById('cmd-input');
        let activeIdx = 0;

        function update(idx) {
            items.forEach(i => i.classList.remove('active'));
            items[idx].classList.add('active');
            
            const desc = items[idx].getAttribute('data-desc');
            descEl.innerText = '> ' + desc;
            
            const label = items[idx].querySelector('.label').innerText.toLowerCase();
            cmdEl.innerText = (idx === 3) ? 'vim ' + label : 'cd ' + label;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'j') {
                activeIdx = (activeIdx + 1) % items.length;
                update(activeIdx);
            }
            if (e.key === 'ArrowUp' || e.key === 'k') {
                activeIdx = (activeIdx - 1 + items.length) % items.length;
                update(activeIdx);
            }
        });
    </script>
</body>
</html>
