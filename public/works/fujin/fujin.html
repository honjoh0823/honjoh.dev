            <h1>風神配列 — 左手だけで日本語入力を</h1>
            <p>左手だけで両手分の働きをする片手用キーボード配列です。大和配列の思想を受け継ぎ、片手入力に最適化しました。</p>

            <h2>風神配列とは</h2>
            <p>片手で日本語を自由自在に入力するための、左手専用キーボード配列です。ファンクションキーからスペースキーまで、6段すべてを使用します。</p>

            <h2>キーボードレイアウト</h2>
            <p>左手だけで使用するため、キーボードの左半分のみを使用します。6段構成で、通常の3段に加え、ファンクションキー行、数字行、修飾キー行を活用します。</p>

            <h3>通常入力（子音）</h3>
            <pre>
上段:   M  Y  R  W  P
中段:   K  S  T  N  H
下段:   Z  D  B  G  J
            </pre>

            <h3>母音の入力</h3>
            <p>キーを押しながら別のキーを押すことで母音が入力されます。同時押しの組み合わせにより、左手だけで子音と母音の両方を打鍵できます。</p>

            <h2>よくある質問</h2>

            <h3>Q. 誰のための配列ですか？</h3>
            <p>右手が使えない方、利き手を怪我された方、片手操作を好む方など、左手だけでキーボード入力をしたい全ての方のための配列です。</p>

            <h3>Q. 大和配列との違いは？</h3>
            <p>大和配列は左手で子音、右手で母音を打つ両手配列です。風神配列は左手だけで子音と母音の両方を入力します。子音の配列位置（50音順）は同じです。</p>

            <h3>導入方法</h3>
            <p><strong>Windows:</strong> <a href="https://www.autohotkey.com/">AutoHotkey v2</a> をインストールし、<a
                    href="/works/fujin/lu1.ahk">lu1.ahk</a> をダウンロードして起動。</p>
