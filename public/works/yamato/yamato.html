            <h1>大和配列 — 日本語入力に最適化された新しいキーボード配列</h1>
            <p>日本語入力に最適化された新しいキーボード配列です。覚えやすく、疲れづらい。簡単に導入でき、いつでも戻せます。簡単にマスターでき、入力速度が2倍になります。</p>

            <h2>はじめに</h2>
            <p>QWERTY配列は、1870年代にタイプライター業界の都合で生まれた配列です。その配列が150年経った今もそのまま使われ続けています。</p>

            <h2>QWERTYと日本語の相性</h2>
            <p>日本語のローマ字入力は、必ず母音を含みます。しかしQWERTY配列では母音が鍵盤上に散らばっており、指と手首を常に大きく移動し続ける必要があります。</p>

            <h2>QWERTYのホームポジション</h2>
            <p>QWERTYのホームキー F と J は、日本語入力での出現頻度が最低クラス。最も打ちやすい位置に、ほとんど使わないキーが配置されています。指は常にホームから離れ、疲労が蓄積します。</p>

            <h2>大和配列の特徴</h2>
            <p>日本語の「子音＋母音」という構造に正面から向き合い、誰でも導入できるよう、キーの配置を根本から再設計しました。特別なキーボードは不要 —
                今お使いのQWERTYキーボードをそのまま使い、ソフトウェアでキー配列を変換します。</p>

            <h3>左手が子音、右手が母音</h3>
            <p>ローマ字入力は基本的に「子音 → 母音」の繰り返し。左右交互のリズミカルな打鍵が、そのまま日本語になります。この構造は英語入力とも相性がよく、バランスのよい打鍵が可能です。</p>

            <h3>キー配列</h3>
            <pre>
上段:   M  Y  R  W  P  |  X  L  Q  C  '  [  ]
中段:   K  S  T  N* H  |  F  A* O  I  E  /
下段:   Z  D  B  G  J  |  V  U  -  ,  .
（* = ホームポジション）
左側 = 子音、右側 = 母音 + 低頻度キー
        </pre>

            <h3>あかさたなはまやらわ</h3>
            <p>子音は50音順にそのまま配置。覚えるのではなく、思い出せる設計です。日本の言葉の響き（K-S-T-N-H-M-Y-R-W）がそのままキーボードに並んでいることが「大和」という名前の由来です。</p>

            <h3>濁音は全て下段</h3>
            <p>濁音と半濁音（ぱ行）を完全分離。下の列は「ずんだバーガー」（Z, D, B, G, J + P）と覚えましょう。</p>

            <h3>母音は全て右手</h3>
            <p>手を動かさず、全ての日本語が入力できます。ホーム行にA, O, I, E、下段にUを配置。</p>

            <h3>高頻度キーをホームポジションに集中</h3>
            <p>最も打ちやすい位置に、最もよく使う文字。日本語入力で最頻出の文字（A, K, O, I, N, U, T）がホームポジションに集中しています。</p>

            <h2>他の配列との比較</h2>
            <p>「日本語入力に最適化された配列」（41キーストローク）を打つ場合:</p>

            <p>大和配列はQWERTYと比較して、ホーム列使用率が約2.2倍（34%→76%）、指の移動回数が約40%削減（28回→17回）されます。</p>

            <h2>よくある質問</h2>

            <h3>Q. 特別なキーボードが必要ですか？</h3>
            <p>いいえ。Windowsでは今お使いのQWERTYキーボードをそのまま使えます。AutoHotkeyがキー入力を変換するだけです。特殊なハードウェアやカスタムキーキャップは不要です。</p>

            <h3>Q. QWERTY配列が打てなくなるのでは？</h3>
            <p>英語を覚えても日本語は忘れません。野球を覚えてサッカーを忘れることもありません。最初は忘れる感覚があっても、使っていると徐々にまた思い出します。</p>

            <h3>Q. 名前の由来は？</h3>
            <p>日本の言葉の響き（あかさたなはまやらわ）の子音（K, S, T, N, H, M, Y, R,
                W）がそのままキーボード上に並んでいることに由来します。日本語の50音順がそのまま配列になっている、という意味を込めて「大和」と名付けられました。</p>
