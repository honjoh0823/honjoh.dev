<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大西配列キーカラー比較カタログ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: hsl(230 20% 5.5%);
            --ink: #e0e0e0;
            --soft: #8f98a7;
            --line: rgba(142, 167, 154, .15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            color: var(--ink);
            font-family: "Outfit", "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
            padding: 28px 20px 56px;
        }

        .page {
            width: min(1200px, 100%);
            margin: 0 auto;
        }

        .back {
            display: inline-flex;
            color: var(--soft);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .back:hover {
            color: var(--ink);
        }

        h1 {
            font-size: clamp(24px, 3vw, 34px);
            font-weight: 700;
            letter-spacing: .02em;
            margin-bottom: 6px;
        }

        .lead {
            color: var(--soft);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        /* ── Reference section ── */
        .ref-section {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 32px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255, 255, 255, .02);
        }

        .ref-section .ref-item {
            flex: 1;
            min-width: 220px;
        }

        .ref-section .ref-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .06em;
            margin-bottom: 8px;
            text-align: center;
        }

        .ref-label.blue {
            color: hsl(210 60% 75%);
        }

        .ref-label.amber {
            color: hsl(32 60% 75%);
        }

        /* ── Section headers ── */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .06em;
            margin: 28px 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }

        .section-title.orange {
            color: #f3b06f;
        }

        .section-title.green {
            color: #8bc79b;
        }

        /* ── Candidate cards ── */
        .candidates {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, .015);
            padding: 12px;
            transition: border-color .2s;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, .25);
        }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .card .card-name {
            font-size: 14px;
            font-weight: 600;
        }

        .card .card-hex {
            font-size: 13px;
            color: var(--soft);
            font-weight: 500;
            letter-spacing: .02em;
        }

        .card .card-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
            border: 1px solid rgba(255, 255, 255, .15);
        }

        .card .kbs {
            display: flex;
            gap: 10px;
        }

        .card .kb-col {
            flex: 1;
        }

        .card .kb-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .06em;
            text-align: center;
            margin-bottom: 4px;
            opacity: .6;
        }

        /* ── Mini keyboard ── */
        .mini-kb {
            display: grid;
            gap: 2px;
        }

        .mini-kb .row {
            display: flex;
            justify-content: center;
            gap: 1px;
        }

        .mini-kb .row:nth-child(2) {
            padding-left: 6px;
        }

        .mini-kb .row:nth-child(3) {
            padding-left: 12px;
        }

        .mini-kb .k {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            display: grid;
            place-items: center;
            font-size: 7px;
            font-weight: 500;
            border: none;
            line-height: 1;
        }

        @media (max-width: 700px) {
            .candidates {
                grid-template-columns: 1fr;
            }

            .ref-section {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <a class="back" href="/yamato#18">← /yamato#18 に戻る</a>
        <h1>大西配列キーカラー比較</h1>
        <p class="lead">
            大和配列（青）・QWERTY（アンバー）を基準に、大西配列の候補色を比較します。<br>
            各カードに3配列を並べて表示。公式キーカラー <code>#e68732</code> を含むオレンジ系12色＋グリーン系12色。
        </p>

        <div class="ref-section" id="refSection"></div>

        <div class="section-title orange">ORANGE CANDIDATES</div>
        <div class="candidates" id="orangeList"></div>

        <div class="section-title green">GREEN CANDIDATES</div>
        <div class="candidates" id="greenList"></div>
    </div>

    <script>
        (() => {
            // ── Layout rows (simplified) ──
            const YAMATO = [
                ['M', 'Y', 'R', 'W', 'P', 'X', 'L', 'Q', 'C', "'", '[', ']'],
                ['K', 'S', 'T', 'N', 'H', 'F', 'A', 'O', 'I', 'E', '/'],
                ['Z', 'D', 'B', 'G', 'J', 'V', 'U', '-', ',', '.']
            ];
            const QWERTY = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P', '[', ']'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';', "'"],
                ['Z', 'X', 'C', 'V', 'B', 'N', 'M', ',', '.', '/']
            ];
            const ONISHI = [
                ['Q', 'L', 'U', ',', '.', 'F', 'W', 'R', 'Y', 'P', ' ', ' '],
                ['E', 'I', 'A', 'O', '-', 'K', 'T', 'N', 'S', 'H', ' '],
                ['Z', 'X', 'C', 'V', ';', 'G', 'D', 'M', 'J', 'B']
            ];

            // ── Key frequencies (for saturation simulation) ──
            const FREQ = {
                A: 10, K: 9, O: 8, I: 7, N: 7, U: 6, T: 6, E: 5, S: 5,
                R: 4, W: 3, M: 3, D: 3, H: 3, Y: 3,
                V: 2, C: 2, J: 2, Z: 2, G: 2,
                B: 1, P: 1, F: 1, L: 1, X: 1, Q: 1
            };
            const MAX_FREQ = 10;

            function lerp(a, b, t) { return a + (b - a) * t; }

            // Generate HSL-based key color from ratio
            function keyColor(h, s, ratio) {
                const baseLBg = 12, tgtLBg = 27, baseS = 5;
                const baseLTx = 32, tgtLTx = 88, tgtSTx = 60;
                const bg = `hsl(${h} ${Math.round(lerp(baseS, s, ratio))}% ${Math.round(lerp(baseLBg, tgtLBg, ratio))}%)`;
                const tx = `hsl(${h} ${Math.round(lerp(baseS, tgtSTx, ratio))}% ${Math.round(lerp(baseLTx, tgtLTx, ratio))}%)`;
                return { bg, tx };
            }

            // Render a mini keyboard
            function renderKB(container, layout, colorFn) {
                const kb = document.createElement('div');
                kb.className = 'mini-kb';
                layout.forEach(row => {
                    const rowEl = document.createElement('div');
                    rowEl.className = 'row';
                    row.forEach(ch => {
                        const k = document.createElement('div');
                        k.className = 'k';
                        if (ch.trim()) {
                            k.textContent = ch;
                            const { bg, tx } = colorFn(ch);
                            k.style.background = bg;
                            k.style.color = tx;
                        } else {
                            k.style.visibility = 'hidden';
                        }
                        rowEl.appendChild(k);
                    });
                    kb.appendChild(rowEl);
                });
                container.appendChild(kb);
            }

            // Color function generators
            function makeColorFn(h, s) {
                return (ch) => {
                    const ratio = (FREQ[ch.toUpperCase()] || 0) / MAX_FREQ;
                    return keyColor(h, s, ratio);
                };
            }

            const yamatoColorFn = makeColorFn(210, 55);
            const qwertyColorFn = makeColorFn(32, 50);

            // ── Render reference keyboards ──
            const refEl = document.getElementById('refSection');
            [
                { label: '大和配列 (h=210, Blue)', cls: 'blue', layout: YAMATO, fn: yamatoColorFn },
                { label: 'QWERTY (h=32, Amber)', cls: 'amber', layout: QWERTY, fn: qwertyColorFn }
            ].forEach(({ label, cls, layout, fn }) => {
                const item = document.createElement('div');
                item.className = 'ref-item';
                item.innerHTML = `<div class="ref-label ${cls}">${label}</div>`;
                renderKB(item, layout, fn);
                refEl.appendChild(item);
            });

            // ── Candidate definitions ──
            const orangeCandidates = [
                ['Official #e68732', '#e68732', 33, 70],
                ['Warm Amber', '#DCA14A', 40, 55],
                ['Golden Ochre', '#C89840', 38, 50],
                ['Persimmon', '#F08A3C', 25, 65],
                ['Sunset Orange', '#EB8442', 22, 60],
                ['Soft Tangerine', '#F5A158', 30, 58],
                ['Cinnamon', '#C56D43', 18, 48],
                ['Apricot', '#F2A66C', 28, 52],
                ['Copper', '#B96735', 20, 50],
                ['Terracotta', '#D9784A', 16, 52],
                ['Current (h=14)', '#CF6040', 14, 50],
                ['Burnt Sienna', '#9E5334', 12, 45],
            ];

            const greenCandidates = [
                ['Jade', '#68B67A', 140, 40],
                ['Moss', '#5EA06A', 135, 38],
                ['Mint Leaf', '#7CC08E', 142, 42],
                ['Forest', '#4E8A5F', 148, 35],
                ['Evergreen', '#4C9A72', 155, 38],
                ['Pine', '#427C63', 158, 33],
                ['Sage', '#8CAB7A', 100, 30],
                ['Fern', '#5C9968', 130, 36],
                ['Sea Green', '#4FA37B', 160, 40],
                ['Olive', '#74886A', 105, 25],
                ['Teal Green', '#4A9B8A', 170, 38],
                ['Deep Olive', '#6C9B5B', 110, 38],
            ];

            // ── Render candidate cards ──
            function renderCards(targetId, candidates) {
                const list = document.getElementById(targetId);
                candidates.forEach(([name, hex, h, s]) => {
                    const onishiColorFn = makeColorFn(h, s);

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="card-name"><span class="card-swatch" style="background:${hex}"></span>${name}</span>
                            <span class="card-hex">${hex} (h=${h})</span>
                        </div>
                        <div class="kbs">
                            <div class="kb-col"><div class="kb-label" style="color:${hex}">大西配列</div><div class="onishi-kb"></div></div>
                            <div class="kb-col"><div class="kb-label" style="color:hsl(210 60% 75%)">大和配列</div><div class="yamato-kb"></div></div>
                            <div class="kb-col"><div class="kb-label" style="color:hsl(32 60% 75%)">QWERTY</div><div class="qwerty-kb"></div></div>
                        </div>
                    `;
                    renderKB(card.querySelector('.onishi-kb'), ONISHI, onishiColorFn);
                    renderKB(card.querySelector('.yamato-kb'), YAMATO, yamatoColorFn);
                    renderKB(card.querySelector('.qwerty-kb'), QWERTY, qwertyColorFn);
                    list.appendChild(card);
                });
            }

            renderCards('orangeList', orangeCandidates);
            renderCards('greenList', greenCandidates);
        })();
    </script>
</body>

</html>
