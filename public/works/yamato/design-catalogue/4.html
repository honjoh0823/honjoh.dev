            --hr10-bd: #d85098;
            --hr10-tx: #ffd0f0;

            /* ===== 提案方式: ベースカラー3色のみ ===== */
            --hm-q-h: 40;
            --hm-q-s: 60%;
            /* アンバー */
            --hm-l-h: 212;
            --hm-l-s: 55%;
            /* ブルー */

        * {

            margin: 0

        body {
            min-height: 100vh;
            background: var(--bg);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 256px 256px;
            color: var(--ink);
            font-family: "Outfit", sans-serif;
            padding: 32px 24px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px
        }

        .sub {
            font-size: 13px;
            color: #888;
            margin-bottom: 28px
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .04em;
            color: #6898c8;
            margin: 28px 0 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(104, 152, 200, .15);
        }

        .section-title.amber {
            color: #b89060
        }

        .section-title.pink {
            color: #c86898
        }

        .row-wrap {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            flex-wrap: wrap
        }

        .col-label {
            font-size: 12px;
            color: #555;
            margin-bottom: 6px;
            letter-spacing: .03em;
            font-weight: 600;
        }

        .keys {
            display: flex;
            gap: 4px
        }

        .key {
            width: 54px;
            height: 58px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Outfit", sans-serif;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03), 0 2px 6px rgba(0, 0, 0, .15);
        }

        .key .label {
            font-size: 16px;
            font-weight: 400;
            line-height: 1
        }

        .key .lvl {
            font-size: 9px;
            opacity: .5;
            margin-top: 3px
        }

        /* 現行方式: 個別変数で色指定 */
        .cur .key.h1 {
            background: var(--h1-bg);
            border: 1px solid var(--h1-bd);
            color: var(--h1-tx)
        }

        .cur .key.h2 {
            background: var(--h2-bg);
            border: 1px solid var(--h2-bd);
            color: var(--h2-tx)
        }

        .cur .key.h3 {
            background: var(--h3-bg);
            border: 1px solid var(--h3-bd);
            color: var(--h3-tx)
        }

        .cur .key.h4 {
            background: var(--h4-bg);
            border: 1px solid var(--h4-bd);
            color: var(--h4-tx)
        }

        .cur .key.h5 {
            background: var(--h5-bg);
            border: 1px solid var(--h5-bd);
            color: var(--h5-tx)
        }

        .cur .key.h6 {
            background: var(--h6-bg);
            border: 1px solid var(--h6-bd);
            color: var(--h6-tx)
        }

        .cur .key.h7 {
            background: var(--h7-bg);
            border: 1px solid var(--h7-bd);
            color: var(--h7-tx)
        }

        .cur .key.h8 {
            background: var(--h8-bg);
            border: 1px solid var(--h8-bd);
            color: var(--h8-tx)
        }

        .cur .key.h9 {
            background: var(--h9-bg);
            border: 1px solid var(--h9-bd);
            color: var(--h9-tx)
        }

        .cur .key.h10 {
            background: var(--h10-bg);
            border: 1px solid var(--h10-bd);
            color: var(--h10-tx)
        }

        .cur .key.hl1 {
            background: var(--hl1-bg);
            border: 1px solid var(--hl1-bd);
            color: var(--hl1-tx)
        }

        .cur .key.hl2 {
            background: var(--hl2-bg);
            border: 1px solid var(--hl2-bd);
            color: var(--hl2-tx)
        }

        .cur .key.hl3 {
            background: var(--hl3-bg);
            border: 1px solid var(--hl3-bd);
            color: var(--hl3-tx)
        }

        .cur .key.hl4 {
            background: var(--hl4-bg);
            border: 1px solid var(--hl4-bd);

        }

        .cur .key.hl5 {
            background: var(--hl5-bg);
            border: 1px solid var(--hl5-bd);

        }

        .cur .key.hl6 {
            background: var(--hl6-bg);
            border: 1px solid var(--hl6-bd);
            color: var(--hl6-tx)
        }

        .cur .key.hl7 {
            background: var(--hl7-bg);
            border: 1px solid var(--hl7-bd);
            color: var(--hl7-tx)
        }

        .cur .key.hl8 {
            background: var(--hl8-bg);
            border: 1px solid var(--hl8-bd);
            color: var(--hl8-tx)
        }

        .cur .key.hl9 {
            background: var(--hl9-bg);

        }

        .cur .key.hl10 {

            border: 1px solid var(--hl10-bd);
            color: var(--hl10-tx)
        }

        .cur .key.hr1 {
            background: var(--hr1-bg);
            border: 1px solid var(--hr1-bd);
            color: var(--hr1-tx)
        }

        .cur .key.hr2 {
            background: var(--hr2-bg);
            border: 1px solid var(--hr2-bd);
            color: var(--hr2-tx)
        }

        .cur .key.hr3 {
            background: var(--hr3-bg);
            border: 1px solid var(--hr3-bd);

        }

        .cur .key.hr4 {

            border: 1px solid var(--hr4-bd);
            color: var(--hr4-tx)
        }

        .cur .key.hr5 {
            background: var(--hr5-bg);
            border: 1px solid var(--hr5-bd);
            color: var(--hr5-tx)
        }

        .cur .key.hr6 {
            background: var(--hr6-bg);
            border: 1px solid var(--hr6-bd);
            color: var(--hr6-tx)
        }

        .cur .key.hr7 {
            background: var(--hr7-bg);
            border: 1px solid var(--hr7-bd);

        .cur .key.hr8 {

        /* 提案方式: HSL + 透明度で自動計算 */

        .compare {
            display: flex;
            gap: 32px;
            align-items: flex-start;
            flex-wrap: wrap
        }

        .compare>div {
            flex: 1;
            min-width: 560px
        }

        .var-count {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            margin-left: 8px;
        }

        .var-count.bad {
            background: rgba(200, 80, 80, .15);
            color: #e06060
        }

        .var-count.good {
            background: rgba(80, 200, 120, .15);
            color: #60c080
        }

<body>
    <h1>ヒートマップ カラー比較</h1>
    <p class="sub">現行方式（個別90変数）vs 提案方式（透明度計算・6変数のみ）</p>

    <!-- ===== QWERTY（アンバー系） ===== -->
    <div class="section-title amber">QWERTY ヒートマップ（アンバー系）</div>
    <div class="compare">
        <div>
            <div class="col-label">現行方式 <span class="var-count bad">30変数</span></div>
            <div class="keys cur" id="curQ"></div>
        </div>
        <div>
            <div class="col-label">提案: 透明度計算 <span class="var-count good">2変数</span></div>
            <div class="keys" id="newQ"></div>
        </div>
    </div>

    <!-- ===== 左手（ブルー系） ===== -->
    <div class="section-title">左手 / 子音 ヒートマップ（ブルー系）</div>
    <div class="compare">
        <div>
            <div class="col-label">現行方式 <span class="var-count bad">30変数</span></div>
            <div class="keys cur" id="curL"></div>
        </div>
        <div>
            <div class="col-label">提案: 透明度計算 <span class="var-count good">2変数</span></div>
            <div class="keys" id="newL"></div>
        </div>
    </div>

    <!-- ===== 右手（ピンク系） ===== -->
    <div class="section-title pink">右手 / 母音 ヒートマップ（ピンク系）</div>
    <div class="compare">
        <div>
            <div class="col-label">現行方式 <span class="var-count bad">30変数</span></div>
            <div class="keys cur" id="curR"></div>
        </div>
        <div>
            <div class="col-label">提案: 透明度計算 <span class="var-count good">2変数</span></div>
            <div class="keys" id="newR"></div>
        </div>
    </div>

    <script>
        const LETTERS = ['Z', 'D', 'B', 'G', 'K', 'S', 'T', 'N', 'H', 'A'];

        // 現行方式: CSSクラスで色を参照
        function renderCurrent(el, prefix) {
            el.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const k = document.createElement('div');
                k.className = `key ${prefix}${i}`;
                k.innerHTML = `<span class="label">${LETTERS[i - 1]}</span><span class="lvl">${i}</span>`;
                el.appendChild(k);
            }
        }

        // 提案方式: HSL + 透明度による自動計算
        function hslKey(h, s, level) {
            // bg: ベース暗さ + 色相のティント
            // bd: 色相を中間透明度で
            // tx: レベルに応じた明度スケーリング
            const t = level / 10; // 0.1 ~ 1.0
            const bgL = 6 + t * 10;   // 明度 6% ~ 16%
            const bgS = s * t;
            const bdL = 10 + t * 28;  // 明度 10% ~ 38%
            const bdA = 0.3 + t * 0.7;
            const txL = 15 + t * 70;  // 明度 15% ~ 85%
            const txS = s * (0.3 + t * 0.7);
            return {
                bg: `hsl(${h} ${bgS}% ${bgL}%)`,
                bd: `hsl(${h} ${s}% ${bdL}% / ${bdA})`,
                tx: `hsl(${h} ${txS}% ${txL}%)`
            };
        }

        function renderProposed(el, h, s) {
            el.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const c = hslKey(h, s, i);
                const k = document.createElement('div');
                k.className = 'key';
                k.style.background = c.bg;
                k.style.border = `1px solid ${c.bd}`;
                k.style.color = c.tx;
                k.innerHTML = `<span class="label">${LETTERS[i - 1]}</span><span class="lvl">${i}</span>`;
                el.appendChild(k);
            }
        }

        // QWERTY アンバー: 色相40, 彩度60%
        renderCurrent(document.getElementById('curQ'), 'h');
        renderProposed(document.getElementById('newQ'), 40, 60);

        // 左手 ブルー: 色相212, 彩度55%
        renderCurrent(document.getElementById('curL'), 'hl');
        renderProposed(document.getElementById('newL'), 212, 55);

        // 右手 ピンク: 色相330, 彩度55%
        renderCurrent(document.getElementById('curR'), 'hr');
        renderProposed(document.getElementById('newR'), 330, 55);
    </script>
</body>
