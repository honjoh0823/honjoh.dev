<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESIGN 24 // QUICK ACTIONS</title>
    <style>
        :root {
            --bg: #0c120d;
            --fg: #d2dfd5;
            --dim: #6e8574;
            --accent: #97d0a6;
            --accent-dim: rgba(151, 208, 166, 0.14);
            --line: #1a261d;
            --font: "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            padding: 2.3rem 3.4rem;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 6%;
            right: 5%;
            width: 44vw;
            height: 44vw;
            background: radial-gradient(circle, rgba(151, 208, 166, 0.08) 0%, rgba(151, 208, 166, 0) 70%);
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2.1rem;
            z-index: 1;
        }

        .site {
            letter-spacing: 0.12em;
            font-weight: 700;
        }

        .subtitle {
            color: var(--dim);
            font-size: 0.8rem;
        }

        main {
            flex: 1;
            max-width: 64ch;
            z-index: 1;
        }

        .menu {
            list-style: none;
        }

        .row {
            display: flex;
            align-items: center;
            padding: 0.56rem 0.8rem;
            cursor: pointer;
        }

        .row.active {
            background: var(--accent-dim);
        }

        .num {
            width: 3ch;
            color: var(--dim);
        }

        .row.active .num,
        .row.active .name {
            color: var(--accent);
        }

        .name {
            letter-spacing: 0.05em;
            text-transform: lowercase;
        }

        .desc {
            margin-left: auto;
            color: var(--dim);
            font-size: 0.8rem;
        }

        .context {
            margin-top: 1.1rem;
            padding-left: calc(3ch + 0.8rem);
            color: var(--dim);
            min-height: 3.5rem;
        }

        .actions {
            margin-top: 0.9rem;
            padding-left: calc(3ch + 0.8rem);
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .action {
            border: 1px solid var(--line);
            color: var(--dim);
            background: rgba(151, 208, 166, 0.05);
            padding: 0.12rem 0.5rem;
            font-size: 0.76rem;
            cursor: pointer;
        }

        .action.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .prompt {
            margin-top: auto;
            border-top: 1px solid var(--line);
            padding-top: 0.9rem;
            display: flex;
            align-items: center;
            gap: 1ch;
            z-index: 1;
        }

        .ps {
            color: var(--accent);
            font-weight: 700;
        }

        #input {
            flex: 1;
            font-family: inherit;
            font-size: inherit;
            border: 0;
            outline: 0;
            color: var(--fg);
            background: transparent;
        }

        #input::placeholder {
            color: #56715c;
        }

        .hint {
            margin-top: 0.5rem;
            font-size: 0.72rem;
            color: #56715c;
            z-index: 1;
        }

        .tag {
            position: fixed;
            right: 1rem;
            bottom: 0.7rem;
            color: #2e3d31;
            font-size: 0.62rem;
            z-index: 1;
        }

        @media (max-width: 700px) {
            body {
                padding: 1.2rem;
                font-size: 13px;
            }

            .desc {
                display: none;
            }
        }

        @media (max-height: 760px) {
            body {
                padding-top: 1.3rem;
                padding-bottom: 1.1rem;
            }

            header {
                margin-bottom: 1.1rem;
            }

            .context {
                min-height: 2.7rem;
            }

            .actions {
                margin-top: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="site">HONJOH.DEV</div>
        <div class="subtitle">QUICK ACTIONS</div>
    </header>

    <main>
        <ul class="menu" id="menu">
            <li class="row active" data-context="Current focus: active projects and release notes." data-actions="what are your latest projects?|show yamato layout|open tools page">
                <span class="num">1</span><span class="name">works</span><span class="desc">build log</span>
            </li>
            <li class="row" data-context="Current focus: compact technical articles." data-actions="show recent posts|article about keyboard layout|write summary">
                <span class="num">2</span><span class="name">articles</span><span class="desc">notes</span>
            </li>
            <li class="row" data-context="Current focus: short self-introduction." data-actions="who are you?|what do you build?|show profile">
                <span class="num">3</span><span class="name">about</span><span class="desc">intro</span>
            </li>
            <li class="row" data-context="Current focus: direct AI conversation." data-actions="explain yamato layout|help me choose keys|translate to english">
                <span class="num">4</span><span class="name">chat</span><span class="desc">assistant</span>
            </li>
            <li class="row" data-context="Current focus: preferences and behavior." data-actions="switch color mode|change keybind hints|set japanese">
                <span class="num">5</span><span class="name">setting</span><span class="desc">config</span>
            </li>
        </ul>

        <div class="context" id="context">Current focus: active projects and release notes.</div>
        <div class="actions" id="actions"></div>
    </main>

    <div class="prompt">
        <span class="ps">❯</span>
        <input id="input" type="text" placeholder="ask anything..." aria-label="chat input">
    </div>
    <div class="hint">j/k: move   tab: cycle quick action   enter: apply   1-5: jump</div>
    <div class="tag">GPT-5 Codex // #24</div>

    <script>
        const rows = [...document.querySelectorAll(".row")];
        const contextEl = document.getElementById("context");
        const actionsEl = document.getElementById("actions");
        const input = document.getElementById("input");
        let rowIndex = 0;
        let actionIndex = 0;

        function renderActions(items) {
            actionsEl.innerHTML = "";
            items.forEach((text, i) => {
                const node = document.createElement("button");
                node.type = "button";
                node.className = "action" + (i === actionIndex ? " active" : "");
                node.textContent = text;
                node.addEventListener("click", () => {
                    actionIndex = i;
                    input.value = text;
                    syncActionState();
                });
                actionsEl.appendChild(node);
            });
        }

        function syncActionState() {
            [...actionsEl.children].forEach((node, i) => {
                node.classList.toggle("active", i === actionIndex);
            });
        }

        function setRow(next) {
            rows[rowIndex].classList.remove("active");
            rowIndex = next;
            rows[rowIndex].classList.add("active");
            contextEl.textContent = rows[rowIndex].dataset.context;
            actionIndex = 0;
            const items = rows[rowIndex].dataset.actions.split("|");
            renderActions(items);
            if (document.activeElement !== input || input.value.trim() === "") {
                input.value = items[0];
            }
        }

        function cycleAction() {
            const total = actionsEl.children.length;
            if (!total) return;
            actionIndex = (actionIndex + 1) % total;
            syncActionState();
            input.value = actionsEl.children[actionIndex].textContent;
        }

        document.addEventListener("keydown", (e) => {
            const nav = ["ArrowUp", "ArrowDown", "j", "k", "Tab", "Escape"];
            if (document.activeElement === input && !nav.includes(e.key) && !/^[1-5]$/.test(e.key) && e.key !== "Enter") {
                return;
            }
            if (e.key === "ArrowDown" || e.key === "j") {
                e.preventDefault();
                setRow((rowIndex + 1) % rows.length);
            } else if (e.key === "ArrowUp" || e.key === "k") {
                e.preventDefault();
                setRow((rowIndex - 1 + rows.length) % rows.length);
            } else if (/^[1-5]$/.test(e.key)) {
                e.preventDefault();
                setRow(Number(e.key) - 1);
            } else if (e.key === "Tab") {
                e.preventDefault();
                cycleAction();
            } else if (e.key === "Enter" && document.activeElement === input) {
                e.preventDefault();
                contextEl.textContent = "Queued: " + input.value.trim();
            } else if (e.key === "Escape") {
                input.blur();
            }
        });

        rows.forEach((row, i) => {
            row.addEventListener("mouseenter", () => setRow(i));
            row.addEventListener("click", () => setRow(i));
        });

        setRow(0);
    </script>
</body>
</html>
