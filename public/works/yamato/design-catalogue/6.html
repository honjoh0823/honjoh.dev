<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カラーパレット提案 — 3色の組み合わせ比較</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e0e10;
            --ink: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 256px 256px;
            color: var(--ink);
            font-family: "Outfit", sans-serif;
            padding: 32px 24px 80px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px
        }

        .sub {
            font-size: 13px;
            color: #888;
            margin-bottom: 36px;
            line-height: 1.6
        }

        /* ── palette card ── */
        .palette {
            margin-bottom: 48px;
            padding: 24px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .015);
            border: 1px solid rgba(255, 255, 255, .04);
        }

        .palette.selected {
            border-color: rgba(104, 200, 140, .3);
            background: rgba(104, 200, 140, .02);
        }

        .palette-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px
        }

        .palette-num {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            color: #555;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .04);
        }

        .palette-title {
            font-size: 16px;
            font-weight: 600
        }

        .palette-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.6
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .03em;
            margin-left: 6px
        }

        .tag.current {
            background: rgba(255, 180, 60, .12);
            color: #e0a840
        }

        .tag.rec {
            background: rgba(120, 160, 255, .12);
            color: #88b0ff
        }

        /* ── base color swatches ── */
        .base-colors {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap
        }

        .swatch-group {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 4px
        }

        .swatch-info {
            font-size: 11px;
            color: #777;
            line-height: 1.3
        }

        .swatch-info .name {
            font-weight: 600;
            color: #aaa
        }

        /* ── hue group ── */
        .hue-groups {
            display: flex;
            gap: 24px;
            flex-wrap: wrap
        }

        .hue-group {
            flex: 1;
            min-width: 280px
        }

        .hue-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .04em;
            margin-bottom: 6px
        }

        .keys {
            display: flex;
            gap: 3px
        }

        .key {
            width: 50px;
            height: 54px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Outfit", sans-serif;
            border: none;
        }

        .key .label {
            font-size: 15px;
            font-weight: 400;
            line-height: 1
        }

        .key .lvl {
            font-size: 8px;
            opacity: .45;
            margin-top: 2px
        }

        /* ── notes ── */
        .notes {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, .02);
            font-size: 12px;
            color: #666;
            line-height: 1.7
        }

        .notes strong {
            color: #999
        }
    </style>
</head>

<body>
    <h1>カラーパレット提案</h1>
    <p class="sub">
        案A（フラット・ボーダーなし）ベースで、3色（黄/茶系・ブルー系・ピンク/赤系）の色合い組み合わせを比較。<br>
        各パレットで色相・彩度のバランスが変わり、サイト全体の印象が大きく変わる。
    </p>

    <div id="palettes"></div>

    <script>
        const LETTERS = ['Z', 'D', 'B', 'G', 'K', 'S', 'T', 'N', 'H', 'A'];

        // ─── Palette Definitions ───
        // Each palette: { name, desc, tag, amber:[h,s], blue:[h,s], pink:[h,s], notes }
        const PALETTES = [
            {
                name: '現行ベース',
                desc: '現在の A.css で使用中の色相・彩度をそのまま案Aに適用。馴染みのある色味。',
                tag: 'current',
                tagText: '現行',
                amber: [40, 60],
                blue: [212, 55],
                pink: [330, 55],
                notes: '見慣れた色味。アンバーが暖かみあり、ブルーとピンクのコントラストも適度。'
            },
            {
                name: 'ウォームアンバー × ディープブルー',
                desc: 'アンバーをより黄色寄りに、ブルーをやや深い藍色に。コントラスト強め。',
                amber: [45, 70],
                blue: [220, 60],
                pink: [335, 55],
                notes: 'アンバーの黄色感が強まり、QWERTY配列のレトロ感が増す。ブルーがより落ち着いた印象。'
            },
            {
                name: 'ゴールド × スチールブルー',
                desc: 'ゴールド寄りの暖色と、クールなスチールブルー。高級感のある組み合わせ。',
                tag: 'rec',
                tagText: '推奨',
                amber: [38, 55],
                blue: [205, 45],
                pink: [340, 50],
                notes: '彩度を少し下げて全体的に落ち着いた配色。上品さとモダンさの両立。ダークテーマに最も馴染む。'
            },
            {
                name: 'テラコッタ × インディゴ',
                desc: 'アンバーをテラコッタ（赤茶）方向に寄せ、ブルーをインディゴ方向に。土の温もりと深い青。',
                amber: [28, 55],
                blue: [230, 50],
                pink: [345, 50],
                notes: 'アンバーが茶色寄りでアーシー。3色の色相差が大きくなり、分離感が強い。'
            },
            {
                name: 'マスタード × ティール',
                desc: 'マスタード調の黄色と、緑がかったティールブルー。個性的で自然な配色。',
                amber: [48, 65],
                blue: [195, 50],
                pink: [338, 52],
                notes: 'ブルーがティール方向で新鮮。マスタードとピンクが補色関係に近づき、鮮やかな印象。'
            },
            {
                name: 'アンバーバーン × コバルト',
                desc: 'やや赤みがかったアンバーと、鮮やかなコバルトブルー。力強い組み合わせ。',
                amber: [32, 65],
                blue: [215, 65],
                pink: [328, 60],
                notes: '彩度高めで力強いが、ダークテーマ上だと鮮やか過ぎる可能性あり。インパクト重視向き。'
            },
            {
                name: 'ソフトサンド × スモークブルー',
                desc: '全体的に彩度を落とした柔らかいトーン。目に優しいローコントラスト。',
                amber: [42, 40],
                blue: [210, 35],
                pink: [332, 38],
                notes: '長時間の閲覧に最適。ヒートマップの差はやや遠目で分かりにくくなる可能性。'
            },
            {
                name: 'サフラン × ロイヤルブルー × マゼンタ',
                desc: '各色とも鮮やかめに振った、華やかで目を引く配色。プレゼンテーション向き。',
                amber: [44, 75],
                blue: [218, 65],
                pink: [325, 65],
                notes: '最も鮮やかな案。ヒートマップの段階差が一番分かりやすいが、日常遣いとしてはやや派手。'
            },
        ];

        // ─── Render Functions ───
        function hslFlat(h, s, level) {
            const t = level / 10;
            const bgL = 6 + t * 12;
            const bgS = s * t;
            const txL = 18 + t * 68;
            const txS = s * (0.3 + t * 0.7);
            return {
                bg: `hsl(${h} ${bgS}% ${bgL}%)`,
                tx: `hsl(${h} ${txS}% ${txL}%)`
            };
        }

        function renderKeys(container, h, s) {
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const c = hslFlat(h, s, i);
                const k = document.createElement('div');
                k.className = 'key';
                k.style.background = c.bg;
                k.style.color = c.tx;
                k.innerHTML = `<span class="label">${LETTERS[i - 1]}</span><span class="lvl">${i}</span>`;
                container.appendChild(k);
            }
        }

        function swatchColor(h, s) {
            return `hsl(${h} ${s}% 45%)`;
        }

        // ─── Build Page ───
        const root = document.getElementById('palettes');

        PALETTES.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'palette';

            const tagHtml = p.tag
                ? `<span class="tag ${p.tag}">${p.tagText}</span>`
                : '';

            card.innerHTML = `
                <div class="palette-header">
                    <span class="palette-num">パレット ${idx + 1}</span>
                    <span class="palette-title">${p.name}</span>
                    ${tagHtml}
                </div>
                <p class="palette-desc">${p.desc}</p>
                <div class="base-colors">
                    <div class="swatch-group">
                        <div class="swatch" style="background:${swatchColor(...p.amber)}"></div>
                        <div class="swatch-info"><div class="name">QWERTY</div>H${p.amber[0]} S${p.amber[1]}%</div>
                    </div>
                    <div class="swatch-group">
                        <div class="swatch" style="background:${swatchColor(...p.blue)}"></div>
                        <div class="swatch-info"><div class="name">左手</div>H${p.blue[0]} S${p.blue[1]}%</div>
                    </div>
                    <div class="swatch-group">
                        <div class="swatch" style="background:${swatchColor(...p.pink)}"></div>
                        <div class="swatch-info"><div class="name">右手</div>H${p.pink[0]} S${p.pink[1]}%</div>
                    </div>
                </div>
                <div class="hue-groups">
                    <div class="hue-group">
                        <div class="hue-label" style="color:${swatchColor(...p.amber)}">QWERTY（黄/茶系）</div>
                        <div class="keys" id="p${idx}-q"></div>
                    </div>
                    <div class="hue-group">
                        <div class="hue-label" style="color:${swatchColor(...p.blue)}">左手 / 子音（ブルー系）</div>
                        <div class="keys" id="p${idx}-l"></div>
                    </div>
                    <div class="hue-group">
                        <div class="hue-label" style="color:${swatchColor(...p.pink)}">右手 / 母音（ピンク/赤系）</div>
                        <div class="keys" id="p${idx}-r"></div>
                    </div>
                </div>
                <div class="notes"><strong>印象:</strong> ${p.notes}</div>
            `;

            root.appendChild(card);

            // Render keys after DOM insertion
            renderKeys(document.getElementById(`p${idx}-q`), ...p.amber);
            renderKeys(document.getElementById(`p${idx}-l`), ...p.blue);
            renderKeys(document.getElementById(`p${idx}-r`), ...p.pink);
        });
    </script>
</body>

</html>
