<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESIGN 25 // CONTEXT RAIL</title>
    <style>
        :root {
            --bg: #0d1014;
            --fg: #d8dee5;
            --dim: #7a8694;
            --accent: #9fbdd9;
            --accent-dim: rgba(159, 189, 217, 0.14);
            --line: #1d2530;
            --font: "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.62;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 2.3rem 3.2rem;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            right: 8%;
            top: 12%;
            width: 42vw;
            height: 42vw;
            background: radial-gradient(circle, rgba(159, 189, 217, 0.09) 0%, rgba(159, 189, 217, 0) 68%);
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.9rem;
            z-index: 1;
        }

        .brand {
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .meta {
            color: var(--dim);
            font-size: 0.78rem;
        }

        .path {
            color: var(--dim);
            margin-bottom: 1.8rem;
            z-index: 1;
        }

        main {
            flex: 1;
            max-width: 66ch;
            z-index: 1;
        }

        ul {
            list-style: none;
        }

        .row {
            display: flex;
            align-items: center;
            padding: 0.56rem 0.8rem;
            cursor: pointer;
            transition: background 0.14s ease;
        }

        .row.active {
            background: var(--accent-dim);
        }

        .key {
            width: 3ch;
            color: var(--dim);
            font-weight: 700;
        }

        .row.active .key,
        .row.active .label {
            color: var(--accent);
        }

        .label {
            text-transform: lowercase;
            letter-spacing: 0.05em;
        }

        .hint {
            margin-left: auto;
            color: var(--dim);
            font-size: 0.8rem;
        }

        .preview {
            min-height: 3.2rem;
            padding: 1.05rem 0 0 calc(3ch + 0.8rem);
            color: var(--dim);
        }

        .rail {
            margin-top: 0.65rem;
            margin-left: calc(3ch + 0.8rem);
            display: flex;
            flex-direction: column;
            gap: 0.26rem;
        }

        .rail-item {
            color: var(--dim);
            font-size: 0.79rem;
        }

        .rail-item.active {
            color: var(--accent);
        }

        .prompt {
            margin-top: auto;
            border-top: 1px solid var(--line);
            padding-top: 0.9rem;
            display: flex;
            align-items: center;
            gap: 1ch;
            z-index: 1;
        }

        .ps {
            color: var(--accent);
            font-weight: 700;
        }

        #input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--fg);
            font-family: inherit;
            font-size: inherit;
        }

        #input::placeholder {
            color: #5b6878;
        }

        .keys {
            margin-top: 0.5rem;
            color: #5b6878;
            font-size: 0.72rem;
            z-index: 1;
        }

        .tag {
            position: fixed;
            right: 1rem;
            bottom: 0.72rem;
            color: #2f3945;
            font-size: 0.62rem;
            z-index: 1;
        }

        @media (max-width: 720px) {
            body {
                padding: 1.2rem;
                font-size: 13px;
            }

            .hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">HONJOH.DEV</div>
        <div class="meta">CONTEXT RAIL</div>
    </header>

    <div id="path" class="path">home &gt; works</div>

    <main>
        <ul id="menu">
            <li class="row active" data-path="home > works" data-preview="Selected projects and practical outcomes." data-q1="latest release notes" data-q2="show yamato summary">
                <span class="key">1</span><span class="label">works</span><span class="hint">projects</span>
            </li>
            <li class="row" data-path="home > articles" data-preview="Writing focused on implementation and learning." data-q1="recent article topics" data-q2="find keyboard article">
                <span class="key">2</span><span class="label">articles</span><span class="hint">writing</span>
            </li>
            <li class="row" data-path="home > about" data-preview="A short and readable profile." data-q1="introduce honjoh in 1 minute" data-q2="what is your mission">
                <span class="key">3</span><span class="label">about</span><span class="hint">profile</span>
            </li>
            <li class="row" data-path="home > chat" data-preview="Talk to honjoh.ai from this line." data-q1="explain yamato layout" data-q2="help me choose key layout">
                <span class="key">4</span><span class="label">chat</span><span class="hint">assistant</span>
            </li>
            <li class="row" data-path="home > setting" data-preview="Personal preferences and defaults." data-q1="switch language to japanese" data-q2="change accent tone">
                <span class="key">5</span><span class="label">setting</span><span class="hint">config</span>
            </li>
        </ul>
        <div id="preview" class="preview">Selected projects and practical outcomes.</div>
        <div id="rail" class="rail"></div>
    </main>

    <div class="prompt">
        <span class="ps">❯</span>
        <input id="input" type="text" placeholder="ask anything..." aria-label="chat input">
    </div>
    <div class="keys">j/k: move   tab: quick question   1-5: jump   enter: send</div>
    <div class="tag">GPT-5 Codex // #25</div>

    <script>
        const items = [...document.querySelectorAll(".row")];
        const pathEl = document.getElementById("path");
        const previewEl = document.getElementById("preview");
        const railEl = document.getElementById("rail");
        const input = document.getElementById("input");
        let index = 0;
        let quick = 0;

        function paintRail(item) {
            railEl.innerHTML = "";
            const list = [item.dataset.q1, item.dataset.q2];
            list.forEach((text, i) => {
                const div = document.createElement("div");
                div.className = "rail-item" + (i === quick ? " active" : "");
                div.textContent = "> " + text;
                railEl.appendChild(div);
            });
            if (document.activeElement !== input || input.value.trim() === "") {
                input.value = list[quick];
            }
        }

        function update(next) {
            items[index].classList.remove("active");
            index = next;
            quick = 0;
            const active = items[index];
            active.classList.add("active");
            pathEl.textContent = active.dataset.path;
            previewEl.textContent = active.dataset.preview;
            paintRail(active);
        }

        function cycleQuick() {
            quick = (quick + 1) % 2;
            paintRail(items[index]);
        }

        document.addEventListener("keydown", (e) => {
            const nav = ["ArrowUp", "ArrowDown", "j", "k", "Tab", "Escape"];
            if (document.activeElement === input && !nav.includes(e.key) && !/^[1-5]$/.test(e.key) && e.key !== "Enter") {
                return;
            }
            if (e.key === "ArrowDown" || e.key === "j") {
                e.preventDefault();
                update((index + 1) % items.length);
            } else if (e.key === "ArrowUp" || e.key === "k") {
                e.preventDefault();
                update((index - 1 + items.length) % items.length);
            } else if (/^[1-5]$/.test(e.key)) {
                e.preventDefault();
                update(Number(e.key) - 1);
            } else if (e.key === "Tab") {
                e.preventDefault();
                cycleQuick();
            } else if (e.key === "Enter" && document.activeElement === input) {
                e.preventDefault();
                previewEl.textContent = "Queued: " + input.value.trim();
            } else if (e.key === "Escape") {
                input.blur();
            }
        });

        items.forEach((item, i) => {
            item.addEventListener("mouseenter", () => update(i));
            item.addEventListener("click", () => update(i));
        });

        update(0);
    </script>
</body>
</html>
