<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Path Preview - Typing Compare</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: hsl(230 20% 5.5%);
            --ink: #e0e0e0;
            --soft: #787878;
            --accent: hsl(210 55% 55%);
            --k-n-bg: hsl(230 5% 12%);
            --k-n-tx: hsl(230 5% 32%);
            --k-qn-bg: hsl(32 22% 12%);
            --k-qn-tx: hsl(32 16% 30%);
            --q-path: hsl(32 52% 60%);
            --y-path-l: hsl(210 55% 55%);
            --y-path-r: hsl(345 52% 70%);
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: "Outfit", "Zen Kaku Gothic New", sans-serif;
            padding: 0 24px 80px;
            margin: 0
        }

        h1 {
            font-size: 16px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 16px;
            color: var(--soft)
        }

        /* Bottom padding for fixed input area */
        body {
            padding-bottom: 70px
        }

        /* Input area - fixed to bottom */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg);
            border-top: 1px solid #333
        }

        .input-area input {
            flex: 1;
            background: hsl(230 5% 10%);
            color: var(--ink);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 16px;
            outline: none
        }

        .input-area input:focus {
            border-color: var(--accent)
        }

        .input-area button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap
        }

        .input-area button:hover {
            opacity: .85
        }

        /* Sticky top section */
        .top-section {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            padding: 6px 0 4px;
            border-bottom: 1px solid #222
        }

        /* Active preview */
        .active-preview {
            max-width: 960px;
            margin: 0 auto 4px;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 8px 18px;
            background: hsl(230 8% 7%)
        }

        .preview-phrase {
            text-align: center;
            font-size: 20px;
            margin-bottom: 8px;
            letter-spacing: .05em
        }

        .typing-display {
            text-align: center;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2px
        }

        .tc-char {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 2px 4px
        }

        .tc-ja {
            font-size: 16px
        }

        .tc-keys {
            display: flex;
            gap: 1px
        }

        .tc-roma {
            font-size: 10px;
            color: var(--soft);
            padding: 1px 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, .03)
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 14px;
            font-size: 14px;
            color: var(--soft)
        }

        .stats-row b {
            color: var(--ink)
        }

        .stats-row .diff {
            color: var(--accent);
            font-weight: 600
        }

        .compare {
            display: flex;
            gap: 18px;
            justify-content: center
        }

        .panel {
            flex: 1;
            max-width: 460px
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: .03em
        }

        .panel.q .panel-title {
            color: hsl(32 52% 60%)
        }

        .panel.y .panel-title {
            color: var(--accent)
        }

        .panel-stats {
            text-align: center;
            font-size: 12px;
            color: var(--soft);
            margin-bottom: 4px
        }

        .panel-stats b {
            color: var(--ink)
        }

        .kb-wrap {
            position: relative;
            padding: 4px
        }

        .kb {
            display: grid;
            gap: 3px
        }

        .kb .row {
            display: flex;
            justify-content: center;
            gap: 2px
        }

        .kb .row:nth-child(2) {
            padding-left: 10px
        }

        .kb .row:nth-child(3) {
            padding-left: 20px
        }

        .key {
            width: clamp(24px, 2.8vw, 34px);
            height: clamp(26px, 3vw, 36px);
            border-radius: 4px;
            display: grid;
            place-items: center;
            font-size: clamp(9px, 1vw, 12px);
            font-weight: 400;
            border: none;
            position: relative
        }

        .panel.y .key {
            background: var(--k-n-bg);
            color: var(--k-n-tx)
        }

        .panel.q .key {
            background: var(--k-qn-bg);
            color: var(--k-qn-tx)
        }

        .key.home::after {
            content: "";
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 1.5px;
            border-radius: 1px;
            background: rgba(255, 255, 255, .18)
        }

        .key.used {
            font-weight: 600
        }

        .panel.y .key.used {
            background: hsl(215 30% 22%);
            color: hsl(210 50% 70%)
        }

        .panel.q .key.used {
            background: hsl(32 44% 20%);
            color: hsl(32 52% 60%)
        }

        svg.overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: visible
        }

        .path-line {
            stroke-linecap: round;
            stroke-width: 2;
            fill: none;
            opacity: .55
        }

        /* History */
        .history {
            max-width: 1200px;
            margin: 0 auto;
            padding-top: 16px
        }

        .history-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--soft);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .history-title button {
            background: none;
            border: 1px solid #333;
            color: var(--soft);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px
        }

        .history-table th {
            text-align: left;
            color: var(--soft);
            font-weight: 400;
            padding: 6px 8px;
            border-bottom: 1px solid #222
        }

        .history-table td {
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, .04)
        }

        .history-table tr:hover {
            background: rgba(255, 255, 255, .02)
        }

        .history-table .num {
            text-align: right;
            font-variant-numeric: tabular-nums
        }

        .history-table .best {
            color: var(--accent);
            font-weight: 600
        }

        .history-table .phrase-cell {
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .history-table .note-cell {
            font-size: 11px;
            color: var(--soft);
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .sort-btn {
            cursor: pointer;
            user-select: none
        }

        .sort-btn:hover {
            color: var(--ink)
        }

        .history-table tr.selected {
            background: rgba(100, 160, 220, .12);
            outline: 1px solid rgba(100, 160, 220, .25)
        }

        /* Language tabs */
        .lang-tabs {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-bottom: 4px
        }

        .lang-tab {
            background: hsl(230 5% 10%);
            color: var(--soft);
            border: 1px solid #333;
            border-radius: 6px 6px 0 0;
            padding: 8px 24px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            transition: all .15s
        }

        .lang-tab:hover {
            color: var(--ink);
            background: hsl(230 5% 13%)
        }

        .lang-tab.active {
            background: hsl(230 8% 7%);
            color: var(--ink);
            border-bottom-color: hsl(230 8% 7%);
            font-weight: 600
        }

        .lang-tab.disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .coming-soon {
            text-align: center;
            color: var(--soft);
            padding: 40px;
            font-size: 14px
        }
    </style>
</head>

<body>
    <div class="top-section">
        <div class="lang-tabs">
            <button class="lang-tab active" data-lang="ja">日本語</button>
            <button class="lang-tab" data-lang="en">English</button>
            <button class="lang-tab" data-lang="zh">中文</button>
            <button class="lang-tab" data-lang="ko">한국어</button>
        </div>
        <div class="coming-soon" id="comingSoon" style="display:none">Coming Soon — 中文(ピンイン)対応は後日追加予定</div>
        <div class="active-preview" id="activePreview" style="display:none">
            <div class="compare">
                <div class="panel q">
                    <div class="panel-title">QWERTY</div>
                    <div class="panel-stats" id="qStats"></div>
                    <div class="kb-wrap" id="qWrap">
                        <div class="kb" id="qKb"></div><svg class="overlay" id="qSvg"></svg>
                    </div>
                </div>
                <div class="panel y">
                    <div class="panel-title">大和配列</div>
                    <div class="panel-stats" id="yStats"></div>
                    <div class="kb-wrap" id="yWrap">
                        <div class="kb" id="yKb"></div><svg class="overlay" id="ySvg"></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div style="max-width:960px;margin:0 auto;padding:8px 0">
        <div class="preview-phrase" id="previewPhrase"></div>
        <div class="typing-display" id="typingDisplay"></div>
        <div class="stats-row" id="statsRow"></div>
    </div>

    <div class="history">
        <div class="history-title">結果一覧 <button id="clearBtn">Clear</button></div>
        <table class="history-table">
            <thead>
                <tr>
                    <th class="sort-btn" data-col="idx">#</th>
                    <th>構文</th>
                    <th>訳</th>
                    <th class="sort-btn num" data-col="len">文字</th>
                    <th class="sort-btn num" data-col="q">Q線</th>
                    <th class="sort-btn num" data-col="y">Y線</th>
                    <th class="sort-btn num" data-col="diff">差</th>
                    <th class="sort-btn num" data-col="ratio">比率</th>
                    <th class="sort-btn num" data-col="qHome">Q Home%</th>
                    <th class="sort-btn num" data-col="yHome">Y Home%</th>
                    <th class="sort-btn num" data-col="homeDiff">Home差</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <div class="input-area">
        <input type="text" id="phraseInput" placeholder="ひらがなで構文を入力..." autofocus />
        <button id="addBtn">追加</button>
    </div>

    <script>
        const QR = [[['Q'], ['W'], ['E'], ['R'], ['T'], ['Y'], ['U'], ['I'], ['O'], ['P'], ['['], [']']], [['A'], ['S'], ['D'], ['F', 1], ['G'], ['H'], ['J', 1], ['K'], ['L'], [';'], ["'"]], [['Z'], ['X'], ['C'], ['V'], ['B'], ['N'], ['M'], [','], ['.'], ['/']]];
        const YR = [[['M'], ['Y'], ['R'], ['W'], ['P'], ['X'], ['L'], ['Q'], ['C'], ["'"], ['['], [']']], [['K'], ['S'], ['T'], ['N', 1], ['H'], ['F'], ['A', 1], ['O'], ['I'], ['E'], ['/']], [['Z'], ['D'], ['B'], ['G'], ['J'], ['V'], ['U'], ['-'], [','], ['.']]];
        const QF = { Q: 0, A: 0, Z: 0, W: 1, S: 1, X: 1, E: 2, D: 2, C: 2, R: 3, T: 3, F: 3, G: 3, V: 3, B: 3, Y: 4, U: 4, H: 4, J: 4, N: 4, M: 4, I: 5, K: 5, O: 6, L: 6, P: 7 };
        const QH = { 0: 'A', 1: 'S', 2: 'D', 3: 'F', 4: 'J', 5: 'K', 6: 'L', 7: ';' };
        const YF = { M: 0, K: 0, Z: 0, Y: 1, S: 1, D: 1, R: 2, T: 2, B: 2, W: 3, N: 3, G: 3, P: 3, H: 3, J: 3, X: 4, F: 4, V: 4, L: 4, A: 4, U: 4, Q: 5, O: 5, C: 6, I: 6, E: 7 };
        const YH = { 0: 'K', 1: 'S', 2: 'T', 3: 'N', 4: 'A', 5: 'O', 6: 'I', 7: 'E' };

        // Home row key sets for percentage calculation
        const Q_HOME_KEYS = new Set(['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L']);
        const Y_HOME_KEYS = new Set(['K', 'S', 'T', 'N', 'H', 'F', 'A', 'O', 'I', 'E']);

        function calcHomePercent(flat, homeSet) {
            if (!flat.length) return 0;
            const homeCount = flat.filter(k => homeSet.has(k)).length;
            return Math.round(homeCount / flat.length * 100);
        }

        // Kana → romaji mapping (single kana)
        const kanaMap = {
            'あ': ['A'], 'い': ['I'], 'う': ['U'], 'え': ['E'], 'お': ['O'],
            'か': ['K', 'A'], 'き': ['K', 'I'], 'く': ['K', 'U'], 'け': ['K', 'E'], 'こ': ['K', 'O'],
            'さ': ['S', 'A'], 'し': ['S', 'I'], 'す': ['S', 'U'], 'せ': ['S', 'E'], 'そ': ['S', 'O'],
            'た': ['T', 'A'], 'ち': ['T', 'I'], 'つ': ['T', 'U'], 'て': ['T', 'E'], 'と': ['T', 'O'],
            'な': ['N', 'A'], 'に': ['N', 'I'], 'ぬ': ['N', 'U'], 'ね': ['N', 'E'], 'の': ['N', 'O'],
            'は': ['H', 'A'], 'ひ': ['H', 'I'], 'ふ': ['H', 'U'], 'へ': ['H', 'E'], 'ほ': ['H', 'O'],
            'ま': ['M', 'A'], 'み': ['M', 'I'], 'む': ['M', 'U'], 'め': ['M', 'E'], 'も': ['M', 'O'],
            'や': ['Y', 'A'], 'ゆ': ['Y', 'U'], 'よ': ['Y', 'O'],
            'ら': ['R', 'A'], 'り': ['R', 'I'], 'る': ['R', 'U'], 'れ': ['R', 'E'], 'ろ': ['R', 'O'],
            'が': ['G', 'A'], 'ぎ': ['G', 'I'], 'ぐ': ['G', 'U'], 'げ': ['G', 'E'], 'ご': ['G', 'O'],
            'ざ': ['Z', 'A'], 'じ': ['Z', 'I'], 'ず': ['Z', 'U'], 'ぜ': ['Z', 'E'], 'ぞ': ['Z', 'O'],
            'だ': ['D', 'A'], 'ぢ': ['D', 'I'], 'づ': ['D', 'U'], 'で': ['D', 'E'], 'ど': ['D', 'O'],
            'ば': ['B', 'A'], 'び': ['B', 'I'], 'ぶ': ['B', 'U'], 'べ': ['B', 'E'], 'ぼ': ['B', 'O'],
            'ぱ': ['P', 'A'], 'ぴ': ['P', 'I'], 'ぷ': ['P', 'U'], 'ぺ': ['P', 'E'], 'ぽ': ['P', 'O'],
            'わ': ['W', 'A'], 'を': ['W', 'O'],
            'ん': ['N', 'N'],
        };
        // Yōon: kana + small ゃゅょ
        const yoonMap = {
            'きゃ': ['K', 'Y', 'A'], 'きゅ': ['K', 'Y', 'U'], 'きょ': ['K', 'Y', 'O'],
            'しゃ': ['S', 'Y', 'A'], 'しゅ': ['S', 'Y', 'U'], 'しょ': ['S', 'Y', 'O'],
            'ちゃ': ['T', 'Y', 'A'], 'ちゅ': ['T', 'Y', 'U'], 'ちょ': ['T', 'Y', 'O'],
            'にゃ': ['N', 'Y', 'A'], 'にゅ': ['N', 'Y', 'U'], 'にょ': ['N', 'Y', 'O'],
            'ひゃ': ['H', 'Y', 'A'], 'ひゅ': ['H', 'Y', 'U'], 'ひょ': ['H', 'Y', 'O'],
            'みゃ': ['M', 'Y', 'A'], 'みゅ': ['M', 'Y', 'U'], 'みょ': ['M', 'Y', 'O'],
            'りゃ': ['R', 'Y', 'A'], 'りゅ': ['R', 'Y', 'U'], 'りょ': ['R', 'Y', 'O'],
            'ぎゃ': ['G', 'Y', 'A'], 'ぎゅ': ['G', 'Y', 'U'], 'ぎょ': ['G', 'Y', 'O'],
            'じゃ': ['Z', 'Y', 'A'], 'じゅ': ['Z', 'Y', 'U'], 'じょ': ['Z', 'Y', 'O'],
            'びゃ': ['B', 'Y', 'A'], 'びゅ': ['B', 'Y', 'U'], 'びょ': ['B', 'Y', 'O'],
            'ぴゃ': ['P', 'Y', 'A'], 'ぴゅ': ['P', 'Y', 'U'], 'ぴょ': ['P', 'Y', 'O'],
        };

        // Current language mode
        let currentLang = 'ja';

        function toRomaji(phrase) {
            const w = [], chars = [...phrase];
            for (let i = 0; i < chars.length; i++) {
                const ch = chars[i];
                // Check yōon (2-char combo)
                if (i + 1 < chars.length) {
                    const combo = ch + chars[i + 1];
                    if (yoonMap[combo]) {
                        w.push({ ja: combo, r: yoonMap[combo] });
                        i++; // skip next char
                        continue;
                    }
                }
                // Geminate っ: double the next consonant
                if (ch === 'っ' && i + 1 < chars.length) {
                    const nx = chars[i + 1];
                    // Check if next is yōon combo
                    let nextKeys;
                    if (i + 2 < chars.length && yoonMap[nx + chars[i + 2]]) {
                        nextKeys = yoonMap[nx + chars[i + 2]];
                    } else if (kanaMap[nx]) {
                        nextKeys = kanaMap[nx];
                    }
                    if (nextKeys && nextKeys.length > 0) {
                        w.push({ ja: 'っ', r: [nextKeys[0]] }); // double the first consonant
                        continue;
                    }
                }
                if (!kanaMap[ch]) continue;
                let keys;
                if (ch === 'ん' && i + 1 < chars.length) {
                    const nx = chars[i + 1];
                    // ん before consonant-starting kana → single N
                    // ん before vowel/や行/end → NN
                    const nextCombo = (i + 2 < chars.length) ? nx + chars[i + 2] : '';
                    const nextKeys = yoonMap[nextCombo] || kanaMap[nx];
                    if (nextKeys && nextKeys.length > 1) {
                        keys = ['N']; // single N (next starts with consonant)
                    } else {
                        keys = ['N', 'N'];
                    }
                } else {
                    keys = kanaMap[ch];
                }
                w.push({ ja: ch, r: keys });
            }
            const flat = w.flatMap(c => c.r);
            return { flat, word: w };
        }

        // English: each letter becomes a single key press
        function toAlpha(phrase) {
            const w = [];
            for (const ch of phrase) {
                const upper = ch.toUpperCase();
                if (/[A-Z]/.test(upper)) {
                    w.push({ ja: ch, r: [upper] });
                }
                // Skip spaces and non-alpha characters
            }
            const flat = w.map(c => c.r[0]);
            return { flat, word: w };
        }

        // Unified conversion dispatcher
        function convertPhrase(phrase, lang) {
            if (lang === 'en' || lang === 'zh' || lang === 'ko') return toAlpha(phrase);
            return toRomaji(phrase);
        }

        // Count finger movements with return-to-home logic
        function countLines(word, fm, hm) {
            let lines = 0;
            const flat = word.flatMap(c => c.r);
            const fingerPos = {};
            for (let f = 0; f < 8; f++) fingerPos[f] = hm[f];
            for (let i = 0; i < flat.length; i++) {
                const key = flat[i];
                const f = fm[key]; if (f === undefined) continue;
                if (fingerPos[f] !== key) { lines++; fingerPos[f] = key; }
                // Return-to-home: if next key uses a different finger, this finger returns home
                const next = i + 1 < flat.length ? flat[i + 1] : null;
                if (next && fm[next] !== f && hm[f] !== key) {
                    lines++;
                    fingerPos[f] = hm[f];
                }
            }
            return lines;
        }

        function renderKb(el, layout, km) {
            el.innerHTML = '';
            layout.forEach(row => {
                const d = document.createElement('div'); d.className = 'row';
                row.forEach(([ch, hm]) => { const k = document.createElement('div'); k.className = 'key' + (hm ? ' home' : ''); k.textContent = ch; d.appendChild(k); if (!km[ch]) km[ch] = k; });
                el.appendChild(d);
            });
        }

        function ctr(el, w) { const k = el.getBoundingClientRect(), r = w.getBoundingClientRect(); return { x: k.left - r.left + k.width / 2, y: k.top - r.top + k.height / 2 }; }

        // Draw paths with return-to-home logic
        function drawPaths(word, wrap, svg, km, fm, hm, colorFn) {
            const r = wrap.getBoundingClientRect();
            svg.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`); svg.innerHTML = '';
            const usedKeys = new Set(); const ns = 'http://www.w3.org/2000/svg'; let lines = 0;
            const flat = word.flatMap(c => c.r);
            // Init finger positions at home
            const pos = {};
            for (let f = 0; f < 8; f++) { const h = hm[f]; if (km[h]) pos[f] = { ...ctr(km[h], wrap) }; }

            for (let i = 0; i < flat.length; i++) {
                const key = flat[i];
                const f = fm[key]; if (f === undefined || !km[key]) continue;
                usedKeys.add(key);
                const t = ctr(km[key], wrap);
                if (pos[f] && (pos[f].x !== t.x || pos[f].y !== t.y)) {
                    const l = document.createElementNS(ns, 'line');
                    l.setAttribute('x1', pos[f].x); l.setAttribute('y1', pos[f].y);
                    l.setAttribute('x2', t.x); l.setAttribute('y2', t.y);
                    l.setAttribute('stroke', colorFn(f)); l.classList.add('path-line');
                    svg.appendChild(l); lines++;
                }
                pos[f] = { ...t };
                // Return-to-home: if next key uses a different finger, this finger returns home
                const next = i + 1 < flat.length ? flat[i + 1] : null;
                if (next && fm[next] !== f && hm[f] !== key) {
                    const hk = hm[f];
                    if (hk && km[hk] && pos[f]) {
                        const hp = ctr(km[hk], wrap);
                        const l = document.createElementNS(ns, 'line');
                        l.setAttribute('x1', pos[f].x); l.setAttribute('y1', pos[f].y);
                        l.setAttribute('x2', hp.x); l.setAttribute('y2', hp.y);
                        l.setAttribute('stroke', colorFn(f)); l.classList.add('path-line');
                        svg.appendChild(l); lines++;
                        pos[f] = { ...hp };
                    }
                }
            }
            usedKeys.forEach(ch => { if (km[ch]) km[ch].classList.add('used'); });
            return lines;
        }

        // State — per-language history
        const historyMap = { ja: [], en: [], zh: [], ko: [] };
        let sortCol = 'idx', sortAsc = false;

        function getHistory() { return historyMap[currentLang]; }

        function renderPreview(text, lang) {
            lang = lang || currentLang;
            const { flat, word } = convertPhrase(text, lang);
            if (!flat.length) return;
            document.getElementById('activePreview').style.display = '';
            document.getElementById('previewPhrase').textContent = text;
            const td = document.getElementById('typingDisplay'); td.innerHTML = '';
            word.forEach(ch => {
                const g = document.createElement('div'); g.className = 'tc-char';
                g.innerHTML = `<span class="tc-ja">${ch.ja}</span><div class="tc-keys">${ch.r.map(r => `<span class="tc-roma">${r}</span>`).join('')}</div>`;
                td.appendChild(g);
            });
            const qm = {}, ym = {};
            renderKb(document.getElementById('qKb'), QR, qm);
            renderKb(document.getElementById('yKb'), YR, ym);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                const qL = drawPaths(word, document.getElementById('qWrap'), document.getElementById('qSvg'), qm, QF, QH, () => 'var(--q-path)');
                const yL = drawPaths(word, document.getElementById('yWrap'), document.getElementById('ySvg'), ym, YF, YH, f => f < 4 ? 'var(--y-path-l)' : 'var(--y-path-r)');
                document.getElementById('qStats').innerHTML = `指移動 <b>${qL}</b>回`;
                document.getElementById('yStats').innerHTML = `指移動 <b>${yL}</b>回`;
                document.getElementById('statsRow').innerHTML =
                    `<span>Q: <b>${qL}</b></span><span>Y: <b>${yL}</b></span><span class="diff">差: ${qL - yL}</span><span>比率: ${(qL / Math.max(yL, 1)).toFixed(1)}:1</span>`;
            }));
            return { flat };
        }

        function addPhrase(text, lang, note) {
            lang = lang || currentLang;
            text = text.trim(); if (!text) return;
            const { flat, word } = convertPhrase(text, lang); if (!flat.length) return;
            const q = countLines(word, QF, QH), y = countLines(word, YF, YH);
            const len = [...text].length;
            const hist = historyMap[lang];
            const qHome = calcHomePercent(flat, Q_HOME_KEYS);
            const yHome = calcHomePercent(flat, Y_HOME_KEYS);
            hist.push({ idx: hist.length + 1, text, note: note || '', len, q, y, diff: q - y, ratio: +(q / Math.max(y, 1)).toFixed(1), qHome, yHome, homeDiff: yHome - qHome });
            renderPreview(text, lang);
            renderHistory();
        }

        let selectedRowIdx = -1; // index into sorted array
        let sortedCache = [];

        function renderHistory() {
            const history = getHistory();
            sortedCache = [...history].sort((a, b) => {
                const v = sortAsc ? 1 : -1;
                if (typeof a[sortCol] === 'number') return (b[sortCol] - a[sortCol]) * v;
                return 0;
            });
            const maxDiff = history.length ? Math.max(...history.map(h => h.diff)) : 0;
            const body = document.getElementById('historyBody'); body.innerHTML = '';
            sortedCache.forEach((h, i) => {
                const tr = document.createElement('tr');
                const isBest = h.diff === maxDiff;
                if (i === selectedRowIdx) tr.classList.add('selected');
                tr.innerHTML = `<td class="num">${h.idx}</td><td class="phrase-cell">${h.text}</td><td class="note-cell">${h.note || ''}</td><td class="num">${h.len}</td><td class="num">${h.q}</td><td class="num">${h.y}</td><td class="num ${isBest ? 'best' : ''}">${h.diff}</td><td class="num">${h.ratio}</td><td class="num">${h.qHome}%</td><td class="num">${h.yHome}%</td><td class="num ${h.homeDiff > 0 ? 'best' : ''}">${h.homeDiff > 0 ? '+' : ''}${h.homeDiff}%</td>`;
                tr.style.cursor = 'pointer';
                tr.addEventListener('click', () => { selectedRowIdx = i; renderHistory(); renderPreview(h.text); });
                body.appendChild(tr);
            });
        }

        function navigateRow(dir) {
            if (!sortedCache.length) return;
            if (selectedRowIdx < 0) selectedRowIdx = 0;
            else selectedRowIdx = Math.max(0, Math.min(sortedCache.length - 1, selectedRowIdx + dir));
            renderHistory();
            renderPreview(sortedCache[selectedRowIdx].text, currentLang);
            // Scroll selected row into view
            const rows = document.getElementById('historyBody').children;
            if (rows[selectedRowIdx]) rows[selectedRowIdx].scrollIntoView({ block: 'nearest' });
        }

        // Events
        const input = document.getElementById('phraseInput');
        const addBtn = document.getElementById('addBtn');

        input.addEventListener('input', () => {
            const text = input.value.trim();
            if (text) renderPreview(text);
        });

        function doAdd() {
            const text = input.value.trim();
            if (text) { addPhrase(text); input.value = ''; input.focus(); }
        }
        addBtn.addEventListener('click', doAdd);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') doAdd();
            if (e.key === 'ArrowUp') { e.preventDefault(); navigateRow(-1); }
            if (e.key === 'ArrowDown') { e.preventDefault(); navigateRow(1); }
        });

        document.addEventListener('keydown', e => {
            if (document.activeElement === input) return;
            if (e.key === 'ArrowUp') { e.preventDefault(); navigateRow(-1); }
            if (e.key === 'ArrowDown') { e.preventDefault(); navigateRow(1); }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            getHistory().length = 0; renderHistory();
        });

        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const col = btn.dataset.col;
                if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = false; }

        function switchLang(lang) {

            currentLang = lang;
            // Update tab UI
            document.querySelectorAll('.lang-tab').forEach(t => t.classList.toggle('active', t.dataset.lang === lang));
            // Update input area
            const cfg = langConfig[lang];
            input.placeholder = cfg.placeholder;
            addBtn.textContent = cfg.addLabel;
            input.value = '';
            // Toggle visibility
            document.querySelector('.input-area').style.display = '';
            document.getElementById('activePreview').style.display = 'none';
            document.getElementById('comingSoon').style.display = 'none';
            // Reset selection and render history for this lang
            selectedRowIdx = -1;
            // Seed if empty
            if (!historyMap[lang].length && seedsMap[lang].length) {
                seedsMap[lang].forEach(s => {
                    if (Array.isArray(s)) addPhrase(s[0], lang, s[1]);
                    else addPhrase(s, lang);
                });
            }
            renderHistory();
            input.focus();
        }

        document.querySelectorAll('.lang-tab').forEach(tab => {
            tab.addEventListener('click', () => switchLang(tab.dataset.lang));
        });

        // Initialize with Japanese seeds
        seedsMap.ja.forEach(s => addPhrase(s, 'ja'));
    </script>
